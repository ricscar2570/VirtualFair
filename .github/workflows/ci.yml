name: Continuous integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          node scripts/check-lockfile-portability.js
          npm run ci:install

      - name: Generate canonical ESLint and format patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("backend/lambda/common/export-utils.js")
          text = p.read_text()
          text = text.replace(
              'const DANGEROUS_CSV_PREFIX = /^[\\u0000-\\u0020]*[=+\\-@]/u;',
              '// eslint-disable-next-line no-control-regex\\nconst DANGEROUS_CSV_PREFIX = /^[\\u0000-\\u0020]*[=+\\-@]/u;',
          )
          text = text.replace(
              '.replace(/\\u0000/g, "")',
              '// eslint-disable-next-line no-control-regex\\n        .replace(/\\u0000/g, "")',
          )
          p.write_text(text)

          p = Path("backend/lambda/invitations/invite-wrapper.js")
          p.write_text(p.read_text().replace('const { QuotaError } = require("../common/quota-model");\\n', ''))

          p = Path("backend/lambda/quota-reconciliation/index.js")
          text = p.read_text()
          for item in ["getCounter", "eventCounterKey", "standCounterKey", "initializeCounter"]:
              text = text.replace(f"    {item},\\n", "")
              text = text.replace(f"  {item},\\n", "")
          p.write_text(text)

          p = Path("scripts/internal-pilot/preflight.js")
          p.write_text(p.read_text().replace("[.\\\\/_-]", "[./_-]"))

          p = Path("scripts/phase4.5g/tenant-escape.js")
          p.write_text(p.read_text().replace('const path = require("path");\\n', ''))
          PY
          npx eslint . --ext .js --fix || true
          npm run format
          git diff --binary -- . ':(exclude).github/workflows/ci.yml' > quality-fix.patch

      - name: Upload canonical quality patch
        uses: actions/upload-artifact@v4
        with:
          name: quality-fix-patch
          path: quality-fix.patch
          if-no-files-found: error

      - name: Verify source, contracts, tests, and frontend build
        run: npm run verify

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error

  sam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install dependencies
        run: |
          node scripts/check-lockfile-portability.js
          npm run ci:install

      - name: Generate and verify retained pilot template
        run: |
          npm run pilot:generate
          npm run pilot:check

      - name: Validate development and pilot SAM templates
        run: |
          sam validate --lint --template-file template.yaml
          sam validate --lint --template-file infrastructure/backend-pilot.yaml

      - name: Build development and pilot Lambda artifacts
        run: |
          sam build --template-file template.yaml --build-dir .aws-sam-dev
          sam build --template-file infrastructure/backend-pilot.yaml --build-dir .aws-sam-pilot
